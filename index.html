<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gates of Olympus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mainGold: '#F9C846',
                        darkGold: '#B8860B',
                        lightGold: '#FFE082',
                        deepPurple: '#2C1B47',
                        royalPurple: '#4A2C73',
                        panelDark: 'rgba(30, 15, 60, 0.85)',
                        borderColor: '#D4AF37',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['"Roboto Condensed"', 'sans-serif'],
                    },
                    boxShadow: {
                        'gem': '0 4px 8px rgba(0,0,0,0.4), inset 0 -2px 5px rgba(0,0,0,0.3), inset 0 2px 5px rgba(255,255,255,0.2)',
                        'panel': '0 8px 20px rgba(0,0,0,0.6), inset 0 1px 3px rgba(255,215,0,0.3)',
                        'glow-gold': '0 0 12px rgba(249, 200, 70, 0.7), 0 0 24px rgba(249, 200, 70, 0.4)',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .bg-main {
                background: linear-gradient(135deg, #3A1E69 0%, #241242 100%);
                background-image: url('gambar/latar_belakang.png');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-attachment: fixed;
            }
            
            .border-gold-3d {
                border: 2px solid;
                border-image: linear-gradient(to bottom, #FFE082, #B8860B, #FFE082) 1;
                box-shadow: inset 0 0 6px rgba(0,0,0,0.5), 0 3px 6px rgba(0,0,0,0.4);
            }
            .text-3d {
                text-shadow: 0 1px 0 #B8860B, 0 2px 2px rgba(0,0,0,0.4);
            }
            .symbol-3d {
                transform-style: preserve-3d;
                perspective: 800px;
            }
            .symbol-3d > div {
                transform: rotateX(10deg) rotateY(-5deg);
                transition: transform 0.2s ease;
            }
            .symbol-3d:active > div {
                transform: rotateX(5deg) rotateY(3deg) scale(0.95);
            }
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Condensed:wght@700&display=swap');

        @keyframes tumbleDown {
            0% { transform: translateY(-150%) rotateX(30deg); opacity: 0; }
            60% { transform: translateY(10%) rotateX(-10deg); opacity: 0.8; }
            100% { transform: translateY(0) rotateX(0); opacity: 1; }
        }

        @keyframes floatZeus {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.01); }
        }

        @keyframes flashAnim {
            0%, 100% { opacity: 0; }
            40%, 60% { opacity: 0.9; }
        }

        .falling > div {
            animation: tumbleDown 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        .strike { 
            animation: flashAnim 0.3s 3; 
        }
    </style>
</head>
<body class="bg-main min-h-screen flex items-center justify-center p-2 overflow-x-hidden font-sans">
    <!-- Efek Petir -->
    <div id="flash" class="fixed inset-0 bg-white opacity-0 pointer-events-none z-50"></div>

    <!-- Kontainer Utama - Tata Letak Mendatar -->
    <div class="flex flex-row items-start justify-center gap-2 sm:gap-3 w-full max-w-[480px]">
        <!-- Bagian Kiri: Kotak Permainan & Info -->
        <div class="w-full max-w-[320px]">
            <!-- Panel Atas: TOTAL MENANG -->
            <div class="flex justify-center mb-2">
                <div class="bg-panelDark border-gold-3d rounded-sm px-3 py-1.5 w-full text-center">
                    <div class="text-lightGold text-[10px] font-bold tracking-wider">TUMBLE WIN</div>
                    <div class="text-sm font-bold text-mainGold text-3d">Rp 780,00</div>
                </div>
            </div>

            <!-- Grid Permainan 5x5 -->
            <div class="relative mb-2">
                <div class="bg-panelDark border-gold-3d rounded-sm p-1.5 shadow-glow-gold">
                    <div id="grid" class="grid grid-cols-5 grid-rows-5 gap-1 w-full aspect-square bg-deepPurple/50 p-1.5 rounded-sm overflow-hidden touch-manipulation">
                        <!-- Sel simbol akan diisi oleh JS -->
                    </div>
                </div>
            </div>

            <!-- Panel Kredit & Menang -->
            <div class="flex justify-between mb-2 gap-1.5">
                <div class="bg-panelDark border-gold-3d rounded-sm px-2 py-1.5 flex-1 text-center">
                    <span class="text-[9px] text-lightGold">KREDIT: </span>
                    <span id="credit" class="font-bold text-white text-[10px]">Rp 4.185.400,00</span>
                </div>
                <div class="bg-panelDark border-gold-3d rounded-sm px-2 py-1.5 flex-1 text-center">
                    <span class="text-[9px] text-lightGold">MENANG: </span>
                    <span id="winDisplay" class="font-bold text-green-400 text-[10px]">Rp 0,00</span>
                </div>
            </div>

            <!-- Panel Taruhan & Info -->
            <div class="space-y-1.5">
                <div class="bg-panelDark border-gold-3d rounded-sm p-1.5 text-center">
                    <div class="text-lightGold text-[10px] font-semibold mb-0.5">BELI PUTARAN GRATIS</div>
                    <div class="text-white font-bold text-xs">Rp120.000</div>
                </div>
                <div class="bg-panelDark border-gold-3d rounded-sm p-1.5 text-center">
                    <div class="text-lightGold text-[10px] font-semibold mb-0.5">TARUHAN</div>
                    <div class="text-white font-bold text-xs">Rp15.000</div>
                    <div class="text-green-400 text-[9px] mt-0.5 bg-green-900/40 rounded py-0.5">KEMUNGKINAN GANDA</div>
                </div>
                <div class="bg-panelDark border-gold-3d rounded-sm p-1.5 text-[10px] text-white space-y-0.5">
                    <div class="flex justify-between px-2"><span>8</span><span>300.00</span></div>
                    <div class="flex justify-between px-2"><span>9+</span><span>480.00</span></div>
                </div>
            </div>
        </div>

        <!-- Bagian Kanan: Gambar Zeus & Tombol -->
        <div class="flex flex-col items-center gap-2">
            <!-- Gambar Zeus - Di Sebelah Kanan -->
            <div class="relative w-[120px] h-[320px] flex items-center justify-center">
                <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-panelDark border-gold-3d rounded-sm px-2 py-0.5 text-center whitespace-nowrap z-10">
                    <span class="text-mainGold font-bold tracking-wider text-[10px]">GATES OF OLYMPUS</span>
                </div>
                <img 
                    src="gambar/karakter_zeus.png" 
                    alt="Zeus" 
                    class="w-full h-full object-contain drop-shadow-[0_0_10px_rgba(255,215,0,0.6)]"
                    style="animation: floatZeus 4s ease-in-out infinite;"
                    loading="lazy"
                >
            </div>

            <!-- TOMBOL KONTROL -->
            <div class="flex flex-col items-center gap-2">
                <button class="bg-panelDark border-gold-3d rounded-sm px-2 py-1.5 text-white hover:bg-royalPurple active:bg-royalPurple transition-colors text-sm touch-manipulation w-10 h-10 flex items-center justify-center">
                    <i class="fa fa-volume-up"></i>
                </button>

                <button 
                    id="spinBtn" 
                    onclick="play()"
                    class="relative w-16 h-16 rounded-full bg-gradient-to-b from-red-600 to-red-900 border-2 border-mainGold text-mainGold font-bold text-xs uppercase tracking-wider shadow-glow-gold hover:brightness-110 active:brightness-90 active:scale-95 disabled:opacity-50 disabled:grayscale transition-all duration-200 flex items-center justify-center text-sm touch-manipulation select-none">
                    <span class="relative z-10">PUTAR</span>
                    <span class="absolute inset-0.5 rounded-full bg-black/20"></span>
                </button>

                <button class="bg-panelDark border-gold-3d rounded-sm px-2 py-1.5 text-white hover:bg-royalPurple active:bg-royalPurple transition-colors text-sm touch-manipulation w-10 h-10 flex items-center justify-center">
                    <i class="fa fa-cog"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- PANGGIL BERKAS JS -->
    <script src="permainan.js"></script>
</body>
</html>
